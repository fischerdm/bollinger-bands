# Currency settings
currency_settings:
  # Available currencies for conversion
  available_currencies:
    - USD
    - EUR
    - CHF
    - GBP
    - JPY
  
  # Default display currency
  default_currency: USD
  
  #  Currency pair symbols for fetching exchange rates from yfinance
  # Strategy: Define only USD to other currencies
  # All non-USD tickers will be normalized to USD first, then converted to target
  # Format: Quote currency symbols (e.g., CHF=X means "CHF per 1 USD")
  currency_pairs:
    # USD to major currencies (quote format: XXX per 1 USD)
    USDCHF: "CHF=X"       # Swiss Franc per 1 USD
    USDEUR: "EUR=X"       # Euro per 1 USD (try this first, fallback to EURUSD=X inverted)
    USDGBP: "GBP=X"       # British Pound per 1 USD (try this first, fallback to GBPUSD=X inverted)
    USDJPY: "JPY=X"       # Japanese Yen per 1 USD
    
    # Fallback pairs (base format: USD per 1 XXX) - will be inverted
    EURUSD: "EURUSD=X"    # USD per 1 EUR (fallback if EUR=X doesn't work)
    GBPUSD: "GBPUSD=X"    # USD per 1 GBP (fallback if GBP=X doesn't work)


# Data settings
data_settings:
  # Default start date for initial data fetch (use 'max' for maximum history)
  default_start_date: "2000-01-01"
  
  # Directory for storing raw data files
  data_directory: "data/raw"
  
  # Directory for storing currency exchange rate data
  currency_data_directory: "data/currencies"
  
  # Auto-update: fetch missing dates on startup
  auto_update_on_startup: true
  
  # Maximum days to keep in cache before re-downloading
  max_cache_days: null  # null = never expire