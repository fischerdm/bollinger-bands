# Ticker Configuration
# Add or remove tickers as needed. Each ticker should have:
# - symbol: The ticker symbol (required)
# - name: Display name for the UI (required)
# - enabled: Whether to load this ticker (optional, default: true)

tickers:
  - symbol: EEM
    name: "Emerging Markets (EEM)"
    enabled: true
    
  - symbol: URTH
    name: "Global Markets (URTH)"
    enabled: true
    
  - symbol: GDX
    name: "Basic Materials (GDX)"
    enabled: true
    
  - symbol: GDXJ
    name: "Basic Materials (GDXJ)"
    enabled: true
    
  - symbol: LTAM.L
    name: "Latin America (LTAM.L)"
    enabled: true
    
  - symbol: IBB
    name: "Shares Biotechnology ETF (IBB)"
    enabled: true
    
  - symbol: XBI
    name: "State Street SPDR S&P Biotech ETF (XBI)"
    enabled: true
    
  - symbol: IOGP.L
    name: "iShares Oil & Gas Exploration & Production UCITS ETF USD (Acc)"
    enabled: true
    
  - symbol: WENS.AS
    name: "iShares MSCI World Energy Sector UCITS ETF USD Inc"
    enabled: true

  - symbol: INDA
    name: "iShares MSCI India ETF"
    enabled: true

  - symbol: IDX
    name: "VanEck Indonesia Index ETF"
    enabled: true  

  - symbol: EIDO
    name: "iShares MSCI Indonesia ETF"
    enabled: true  

  - symbol: SPDW
    name: "SPDR Portfolio Developed World ex-US ETF"
    enabled: true  
    
  - symbol: WCSS.AS
    name: "iShares MSCI World Consumer Staples Sector Advanced UCITS ETF USD Inc"
    enabled: true

# Data settings
data_settings:
  # Default start date for initial data fetch (use 'max' for maximum history)
  default_start_date: "2000-01-01"
  
  # Directory for storing raw data files
  data_directory: "data/raw"
  
  # Auto-update: fetch missing dates on startup
  auto_update_on_startup: true
  
  # Maximum days to keep in cache before re-downloading
  max_cache_days: null  # null = never expire
