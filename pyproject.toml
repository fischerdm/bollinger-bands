[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bollinger_bands"
version = "0.2.0"
authors = [{ name = "David Fischer", email = "no@email.com" }]
description = "A Python library for Bollinger Bands analysis"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }  
dependencies = [
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "yfinance>=0.1.67",
    "plotly>=5.3.1",
    "dash>=2.0.0",
    "dash-bootstrap-components>=2.0.4",
    "dash-bootstrap-templates>=2.1.0",
    "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = ["pytest>=6.2.0", "black>=21.7b0", "flake8>=3.9.2"]

# ============================================================================
# SETUPTOOLS CONFIGURATION
# ============================================================================

[tool.setuptools]
# Tell setuptools to look for packages in src/
package-dir = { "" = "src" }
include-package-data = true

# Automatically find all packages in src/
# This replaces the manual packages = ["bollinger_bands"] list
[tool.setuptools.packages.find]
where = ["src"]

# Include non-Python files in the package (like YAML configs)
# NOTE: This is for when you move config INTO the package (future enhancement)
# For now, config/tickers.yaml stays in project root, so this section
# is prepared for future use
[tool.setuptools.package-data]
bollinger_bands = [
    "config/*.yaml",     # Future: when config moves to src/bollinger_bands/config/
    "config/*.yml",
]
